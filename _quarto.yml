project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - dashboard-portal.qmd
    - dashboard.qmd
    - css-scss.qmd
    - listings.qmd
    - projects/*.qmd

website:
  title: "Aldo Naranjo"
  site-url: https://naran115.github.io/m10-portfolio-website/
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: "#00695C"
    left:
      - href: index.qmd
        text: Home
      - href: dashboard-portal.qmd
        text: CEP Dashboard
      - href: css-scss.qmd
        text: Styling with CSS/SCSS
      - href: listings.qmd
        text: Listings
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/aldonaranjo
        aria-label: LinkedIn
      - icon: github
        href: https://github.com/naran115/m10-portfolio-website
        aria-label: GitHub repository
  page-footer:
    left: "© 2026 Aldo Naranjo · MS Digital Marketing, Cal Poly Pomona"
    right: "Built with [Quarto](https://quarto.org) and published on GitHub Pages"

format:
  html:
    theme:
      light: [cosmo, custom.scss]
    toc: true
    toc-title: "On this page"
    code-copy: true
    code-fold: show
    highlight-style: github
    smooth-scroll: true
    link-external-newwindow: true
